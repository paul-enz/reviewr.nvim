name: test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.neovim }})
    strategy:
      fail-fast: false
      matrix:
        os: [linux, macos]
        neovim: [v0.10.4, stable]
        include:
          - os: linux
            runs-on: [self-hosted, Linux, X64, proxmox, sabana]
          - os: macos
            runs-on: [self-hosted, macOS, ARM64, sabana]
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: runner.os == 'Linux'
        uses: ./.github/actions/setup-git
      - uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        with:
          neovim: true
          version: ${{ matrix.neovim }}
      - run: nvim --headless -u NONE -l tests/run.lua
